[package]
edition      = "2024"
name         = "s3-sensors"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "s3-sensors"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = ["dhcpv4", "dns", "log", "medium-ethernet", "tcp", "udp"] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
lsm303agr = { version = "1.1", features = ["async"] }
embassy-embedded-hal = "0.6.0"
embassy-sync = "0.8.0"
embedded-hal-async = "1.0.0"
sntpc = { version = "0.11", default-features = false }
sntpc-net-embassy = { version = "0.11", default-features = false }
embassy-futures = "0.1.2"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
